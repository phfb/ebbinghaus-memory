# Ebbinghaus-memory — 三分区记忆（短期 / 长期 / 永久）
#
# ⚠️ 这个文件必须是**顶层 YAML 数组**，否则 loader 直接抛错。
# `id` 同时也是设置项命名空间；`name` 必须等于 package.json 的 name。
#
# patch 的 config 是**整体替换、不深合并**：这里只写你想改的键，其余走代码默认值。
# 但如果你在 profile 的 cordis.patch.yml 里覆写这一行，就要把想保留的键写全。
#
# 所有键都能在 DSH 的插件设置页里改（schemastery 自动表单），
# 也都写在这里当文档。

- insert:
    - id: ebbinghaus-memory
      name: 'ebbinghaus-memory'
      config:
        # 总开关
        enabled: true
        # 记忆库目录。留空 = $DSH_HOME/ebbinghaus-memory
        # （例如 %DSH_HOME%/ebbinghaus-memory）
        dataDir: ''
        # ── 两个临时分区的周期 ────────────────────────────────────
        # ⚠️ 单位写的是「天」，但**算的是时间戳差**：now - 事件时间 >= N × 24 小时。
        #    不是自然日 —— 1 号 23:00 记的事，到 8 号 00:00 只过了 6 天 1 小时，不算到期；
        #    必须实打实过满 168 小时。你这几天不上线，记忆也不会因为"跨了零点"白老一天。
        shortDays: 7
        # 长期同理：28 × 24 小时。
        longDays: 28
        # ── 写入频率 ─────────────────────────────────────────────
        # 每多少次对话（回合）写一次记忆。1 = 每轮都写，2 = 隔一轮。
        writeEveryTurns: 2
        # ── 分区容量（条）→ 超了就触发"回滚压缩" ───────────────────
        # 2026-10-25：默认值 60/120/240 → 120/600/1000（用户嫌记得太少）。
        # 这些值在侧栏面板「调整容量」里也能改，改完存在 <库>/settings.json，
        # 优先级：面板覆盖值 > 这里 > 代码默认值。
        shortCapacity: 120
        longCapacity: 600
        permanentCapacity: 1000
        # ── 全库总量上限（token）→ 第二道闸 ──────────────────────
        # 口径：每一条按注入格式渲染成文字后合计，中文约 1.8 字 = 1 token。
        # 超了自动回收最老、权重最低的那几条（压缩不删除，原文进 _archive）。
        # 上限 300000（硬顶）。怎么定这个数见 README「容量与 token 开销」。
        # ⚠️ 它管的是"库里能囤多少"，不是"每轮花多少" —— 每轮只注入
        #    budgetTokens（1400），库再大也不会每次聊天都变贵。
        totalTokenCapacity: 100000
        # ── 记忆库自检（重复记忆合并）────────────────────────────────
        # 固化那一刻模型看不到库里已有什么，同一件事会被反复记下来。
        # 自检负责事后打扫：跨分区把「说的是同一件事」的并成一条，
        # 细节留最全的那份，原文进 _archive/dedup.jsonl。
        #
        # ⚠️ 三重保证：**(1) 不注入对话** —— 跑在后台队列里，不占 budgetTokens；
        #    **(2) 不调模型** —— 纯本地 IDF 加权重叠系数，毫秒级、零成本；
        #    **(3) 先存档再删** —— 合并不可逆，原文随时能 restore 回来。
        #
        # 每写多少条自检一次。5-100，默认 30。调小=更勤快，调大=更省事。
        dedupEnabled: true
        dedupEveryEntries: 30
        # 重复判定阈值：0.5 是拿真库调出来的 —— 能抓同一件事的不同写法，
        # 又不会把「同一天发生的两件事」揉成一条。
        # 调到 0.65+ 只合几乎一字不差的；调到 0.45- 更主动（边界会糊）。
        dedupThreshold: 0.5
        # ── 分区强度（0=最模糊 1=最详细）────────────────────────────
        # 越深越模糊，但**不能是没有**（有下限）。
        shortDetail: 0.9
        longDetail: 0.55
        permanentDetail: 0.3
        # ── 载入策略（每轮注入）──────────────────────────────────
        # 短期全载（上限）；长期随机取几条；永久只取一小部分。
        loadShortCount: 12
        loadLongRandom: 3
        loadPermanentCount: 3
        # 注入总预算（token），硬顶。超了从最不重要的开始裁。
        budgetTokens: 1400
        # ── 升级门槛（权重 0~1）─────────────────────────────────
        promoteShortToLong: 0.55
        promoteLongToPermanent: 0.7
        # 到期时权重低于这个值就直接淘汰（不升级、不占容量）
        forgetBelow: 0.2
        # ── 选择性记忆检索 ──────────────────────────────────────
        # 命中后最多取回几条（只取那几条，绝不整区载入）
        recallTop: 3
        # 本地关键词自动检索：命中分数超过这个值才注入
        recallThreshold: 2
        # ── 固化用模型 ──────────────────────────────────────────
        # 留空 = 跟随当前默认 provider；model 留空 = deepseek-flash
        provider: ''
        model: ''
        # 结构化抽取不需要思考，**保持 off**（跟随 high 会把 token 全烧在推理上）
        reasoningEffort: off
        maxTokens: 1200
        # 后台任务超时（毫秒）
        jobTimeoutMs: 60000
        # 调试日志（只打形状，绝不落盘对话正文）
        debugLog: false
