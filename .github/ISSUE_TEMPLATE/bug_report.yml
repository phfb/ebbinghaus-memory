name: 报告一个问题
description: 记忆不增长 / 注入里没有记忆 / 面板打不开 / 压缩或去重结果不对
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        先说一句：这个插件会**读你的对话内容**来做总结。贴日志之前请自己扫一遍，
        确认里面没有你不想公开的东西。`debugLog` 只打形状（条数 / token / 耗时），
        不打对话正文 —— 贴它一般是安全的。

  - type: checkboxes
    id: preflight
    attributes:
      label: 先确认这几件
      options:
        - label: 我读完了 README 的「排错」一节
          required: true
        - label: 我贴出来的内容里没有我的记忆原文、密钥或私人对话
          required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 一句人话说清楚。不用写成报告体。
      placeholder: 聊了五轮，面板里短期还是空的。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你以为会发生什么
      placeholder: 应该记下两三条。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么复现的
      description: 能一步步照着做的就写步骤，不能就写「聊到这里就开始不对」。
      placeholder: |
        1. 打开 debugLog
        2. 新开一个会话，聊 3 轮
        3. 面板 → 短期，0 条
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        打开设置里的 `debugLog`，正常应该按顺序出现：
        `记忆库就绪` → `已注册注入段` → `开闸` → `固化开始` → `模型返回` → `记下 N 条`。
        哪一行断了，问题就在那一行之后 —— 请把断掉的位置也一起贴上来。
      render: text
    validations:
      required: false

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 设置 → 关于，或者 `dsh --version`
      placeholder: 0.2.0-rc.2
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 装的是哪个 commit / 哪个版本号
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: zone
    attributes:
      label: 涉及哪个区
      multiple: true
      options:
        - 短期 short
        - 长期 long
        - 永久 permanent
        - 注入 / 预算
        - 检索 memory_search
        - 面板
        - 自检（去重）
        - 压缩 / 冷存档
        - 迁移 / 导入导出
        - 装不上 / 加载失败

  - type: textarea
    id: config
    attributes:
      label: 你改过的设置
      description: 只贴你动过的键，别整份贴。
      placeholder: |
        shortCapacity: 300
        totalTokenCapacity: 150000
        writeEveryTurns: 1
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: tried
    attributes:
      label: 试过什么
      options:
        - label: 重启过 DSH
        - label: 跑过 `node tools/preview-injection.mjs` 看过注入长什么样
        - label: 跑过 `node tools/dedup.mjs`（只演不写）
        - label: 删掉 `dedup-state.json` 让它重算过
